  const query=(w.search||'').trim().toLocaleLowerCase();

  const files=[...pcFiles.values(),...(w.path==='silver'?pcSilverRecords:[])]

 function asset(parent,slot,allowEdit=true){const spec=BN_DATA.assets.find(x=>x[0]===slot);if(!spec)return;const f=bnAssetFile(slot),box=pcNode('figure','net-asset'+(/poster/.test(slot)?' poster':''));
  if(f){const img=pcNode('img');img.src=pcUrl(w,f.blob);img.alt=spec[1];box.append(img,pcNode('figcaption','',spec[1]))}else box.append(pcNode('span','net-asset-symbol','▧'),pcNode('span','',spec[1]),pcNode('small','','이미지가 등록되지 않았습니다.'));
  parent.append(box);return box;
 }
 function evidence(parent,p){const details=pcNode('details','net-evidence');details.append(pcNode('summary','','자료 정보'));details.append(pcNode('p','',p.provenance==='note'?'이전 사용자가 남긴 것으로 추정되는 팬메이드 창작 기록입니다. 원작의 공식 인물 발언이나 수사기록이 아닙니다.':p.provenance==='system'?'컴퓨터의 비정상적인 상태를 표현한 가상의 시스템 기록입니다.':'원작 설정을 대조해 구성한 팬메이드 재현 페이지입니다. 기사 문장과 웹사이트 형식은 새로 작성했으며, 아래 출처의 전문을 복제한 문서가 아닙니다.'));for(const [url,label] of p.sources||[]){const link=pcNode('a','',label+' ↗');link.href=url;link.target='_blank';link.rel='noopener noreferrer';details.append(link)}if(p.collection==='blind'&&p.ep>0){const a=pcNode('a','','관련 원작 영상 ↗');a.href='https://www.youtube.com/watch?v='+BN_VIDEOS[p.ep-1];a.target='_blank';a.rel='noopener noreferrer';details.append(a)}parent.append(details)}
 function article(p){
  const outer=pcNode('article','net-article net-theme-'+(p.theme||'document')),mast=pcNode('div','net-masthead');mast.append(pcNode('b','',p.site),pcNode('span','net-small',BN_KINDS[p.kind]));outer.append(mast);const nav=pcNode('nav','net-site-nav');nav.append(anchor('모아 검색','pc://시작'),anchor('관련 자료','pc://검색?q='+encodeURIComponent((p.tags||[])[0]||p.title)));outer.append(nav);
  const grid=pcNode('div','net-article-grid'),body=pcNode('div','net-article-body'),side=pcNode('aside','net-article-side');body.append(pcNode('div','net-eyebrow',p.kind==='record'?'개인 문서':p.kind==='news'?'관련 보도 자료':p.kind==='document'?'보관 문서':'안내'),pcNode('h1','',p.title),pcNode('p','net-deck',p.summary));
  if(p.asset)asset(body,p.asset);for(const paragraph of p.paragraphs||[])body.append(pcNode('p','net-paragraph',paragraph));if(p.sections?.length){const table=pcNode('table','net-facts');table.setAttribute('aria-label',p.title+' 세부 정보');const tbody=pcNode('tbody');for(const [key,value] of p.sections){const tr=pcNode('tr'),th=pcNode('th','',key);th.scope='row';tr.append(th,pcNode('td','',value));tbody.append(tr)}table.append(tbody);body.append(table)}
  const actions=pcNode('div','net-actions');actions.append(pcButton('이 제목으로 검색',()=>searchFor(p.title.split(' — ')[0])));if(p.kind==='record')actions.append(pcButton('메모장에서 열기',()=>bnOpenNote(p)));body.append(actions);evidence(body,p);
  side.append(pcNode('h3','','이어서 찾아보기'));chips(side,(p.tags||[]).slice(0,6));const related=(p.related||[]).map(bnPage).filter(Boolean);if(related.length){side.append(pcNode('h3','','관련 페이지'));for(const rel of related)side.append(pageLink(rel))}side.append(pcNode('h3','','보관 기록'));side.append(anchor('검색 기록','pc://검색-기록'),anchor('보관 문서','pc://저장한-문서'));
  grid.append(body,side);outer.append(grid);bottom(outer);page.append(outer);
 }
 function history(type){header(page,type==='search'?'검색 기록':'방문 기록');const body=pcNode('div','net-history');body.append(pcNode('h1','',type==='search'?'검색 기록':'방문 기록'));const rows=bnHistory(type);if(!rows.length)body.append(pcNode('p','net-small','기록이 없습니다.'));for(const x of rows){const row=pcNode('div','net-history-row');row.append(anchor(type==='search'?x.query:x.title||x.url,type==='search'?'pc://검색?q='+encodeURIComponent(x.query):x.url),pcNode('small','',bnDate(x.at)));body.append(row)}page.append(body);bottom(page)}
 function bookmarks(){header(page,'즐겨찾기');const body=pcNode('div','net-history');body.append(pcNode('h1','','즐겨찾기'));for(const url of bnBookmarks()){const p=bnPage(pageId(url)||''),row=pcNode('div','net-history-row');row.append(anchor(p?.title||url,url));body.append(row)}if(!bnBookmarks().length)body.append(pcNode('p','net-small','등록된 즐겨찾기가 없습니다.'));page.append(body);bottom(page)}
 function documents(){header(page,'저장된 문서');const body=pcNode('div','net-history');body.append(pcNode('h1','','보관 문서'));const files=[...pcFiles.values()].filter(f=>!f.deleted&&f.kind==='text').sort((a,b)=>(b.modified||0)-(a.modified||0));if(!files.length)body.append(pcNode('p','net-small','문서가 없습니다.'));for(const f of files){const row=pcNode('div','net-history-row'),button=pcButton(f.name,()=>pcOpenFile(f));button.className='net-text-button';row.append(button,pcNode('small','',fsData[f.parent]?.name||'문서'));body.append(row)}page.append(body);bottom(page)}
 function draw(track=false){
  pcReleaseUrls(w);page.replaceChildren();page.scrollTop=0;const url=state.history[state.index]||'pc://시작';address.value=url;back.disabled=state.index===0;forward.disabled=state.index===state.history.length-1;w.el.querySelector('strong').textContent='인터넷 — 모아';pcUpdateTask(w,'인터넷','internet');
  const key=pageId(url),p=key?bnPage(key):null;ui.status.textContent='로컬 연결';
  if(p){article(p);w.el.querySelector('strong').textContent=p.title+' — 인터넷';ui.status.textContent=p.site}
  else if(url.startsWith('pc://검색?')){const params=new URLSearchParams(url.slice('pc://검색?'.length));results(params.get('q')||'',params.get('type')||'all',params.get('ep')||'all')}
  else if(url==='pc://검색-기록')history('search');
  else if(url==='pc://방문-기록'||url==='pc://history')history('visit');
  else if(url==='pc://즐겨찾기')bookmarks();
  else if(url==='pc://저장한-문서')documents();
  else if(url==='pc://시작'||url==='pc://home')homePage();
  else {header(page);const box=pcNode('div','net-history');box.append(pcNode('h1','','페이지를 찾을 수 없습니다.'),pcNode('p','','주소를 확인하거나 검색으로 다시 찾아보세요.'));searchBox(box,key||url);page.append(box)}
 }
 page.addEventListener('mouseup',()=>{const old=page.querySelector('.net-quote-actions');if(old)old.remove();const selection=window.getSelection();if(!selection||selection.isCollapsed||!page.contains(selection.anchorNode)||!page.contains(selection.focusNode))return;const text=selection.toString().trim().slice(0,200);if(text.length<2)return;const p=bnPage(pageId(state.history[state.index])||'');const bar=pcNode('div','net-quote-actions');bar.append(pcNode('span','',text),pcButton('검색',()=>searchFor(text)));const close=pcButton('×',()=>bar.remove());close.setAttribute('aria-label','선택 도구 닫기');bar.append(close);page.append(bar)});
 draw();
}

document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
